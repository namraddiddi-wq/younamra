<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업보 — 유남라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#6dcdd0;--primary-light:#9de0e2;--primary-pale:#e8f9f9;
  --primary-dark:#4ab8bc;--primary-deep:#2a8a8d;
  --accent:#f0a8c8;--accent-soft:#fde8f2;
  --white:#fff;--gray-100:#f7f7f7;--gray-200:#eee;--gray-400:#bbb;--gray-600:#888;
  --text:#1c1c2e;--text-muted:#6b7280;--shadow:rgba(109,205,208,.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#f0fbfb;color:var(--text);}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1.5px solid var(--primary-pale);display:flex;justify-content:center;}
nav a{font-family:'Gowun Dodum',sans-serif;font-size:.95rem;color:var(--text-muted);text-decoration:none;padding:16px 36px;border-bottom:2.5px solid transparent;transition:color .2s,border-color .2s;}
nav a:hover,nav a.active{color:var(--primary-deep);border-bottom-color:var(--primary);}
main{max-width:960px;margin:0 auto;padding:40px 20px 80px;}
.page-head{font-family:'Gowun Dodum',sans-serif;font-size:1.5rem;color:var(--primary-deep);margin-bottom:8px;}
.page-sub{font-size:.88rem;color:var(--text-muted);margin-bottom:28px;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:20px;}
.search-wrap input{width:100%;padding:10px 16px 10px 40px;border:1.5px solid var(--gray-200);border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:.9rem;background:var(--white);outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:var(--primary);}
.search-wrap::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;}

/* MEMBER GRID */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.member-card{background:var(--white);border-radius:16px;padding:20px;box-shadow:0 3px 18px var(--shadow);transition:transform .2s,box-shadow .2s;}
.member-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--shadow);}
.mc-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.mc-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary-pale),var(--accent-soft));border:2px solid var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.mc-name{font-weight:700;font-size:.95rem;}
.mc-id{font-size:.78rem;color:var(--text-muted);}
.mc-tasks{display:flex;flex-wrap:wrap;gap:6px;}
.task-chip{padding:4px 10px;border-radius:20px;font-size:.78rem;background:var(--primary-pale);color:var(--primary-deep);display:flex;align-items:center;gap:4px;}
.task-chip .qty{font-weight:700;}
.mc-empty{font-size:.83rem;color:var(--gray-400);}

/* UPDATED */
.updated-note{font-size:.8rem;color:var(--gray-400);text-align:right;margin-bottom:12px;}

.empty-state{text-align:center;padding:60px;color:var(--gray-400);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}
footer{text-align:center;padding:28px 20px;color:var(--gray-400);font-size:.8rem;border-top:1px solid var(--gray-200);}
@media(max-width:768px){nav a{padding:14px 18px;font-size:.85rem;}}
</style>
</head>
<body>
<nav>
  <a href="../">프로필</a>
  <a href="../schedule/">일정</a>
  <a href="../songbook/">노래책</a>
  <a href="#" class="active">업보</a>
</nav>
<main>
  <div class="page-head">⚡ 업보 현황</div>
  <div class="page-sub">시청자들의 업보를 공개합니다.</div>
  <div class="updated-note" id="updatedNote"></div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="닉네임 검색...">
  </div>

  <div class="member-grid" id="memberGrid">
    <div class="empty-state"><div class="icon">⚡</div>불러오는 중...</div>
  </div>
</main>
<footer>유남라 팬사이트 · 팬 이름 유랑이 · 팬닉 뒤에 ^´</footer>

<script>
const SUPABASE_URL  = 'https://xigbjaayjqshjulsovqn.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpZ2JqYWF5anFzaGp1bHNvdnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjQwNzgsImV4cCI6MjA5NTQwMDA3OH0.B7akZMoAdrjF7CiLMNHvTOmO1dapHTlkEL8fbho30Us';

const h = { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` };
let members=[], tasks=[], types=[];
let curSearch='';

async function load() {
  const [mRes, tRes, ttRes, sRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/upbo_members?is_hidden=eq.false&order=sort_order.asc`, {headers:h}),
    fetch(`${SUPABASE_URL}/rest/v1/upbo_tasks?order=created_at.desc`, {headers:h}),
    fetch(`${SUPABASE_URL}/rest/v1/upbo_task_types?order=sort_order.asc`, {headers:h}),
    fetch(`${SUPABASE_URL}/rest/v1/upbo_settings?key=eq.updated_at`, {headers:h}),
  ]);
  members = await mRes.json();
  tasks   = await tRes.json();
  types   = await ttRes.json();
  const settings = await sRes.json();
  if (settings[0]) {
    document.getElementById('updatedNote').textContent = `마지막 갱신: ${settings[0].value}`;
  }
  render();
}

function render() {
  const q = curSearch.toLowerCase();
  const list = members.filter(m => !q || (m.nickname||'').toLowerCase().includes(q));
  const grid = document.getElementById('memberGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>검색 결과가 없어요</div>`;
    return;
  }

  const typeMap = Object.fromEntries(types.map(t => [t.id, t.name]));

  grid.innerHTML = list.map(m => {
    const myTasks = tasks.filter(t => t.member_id === m.id);
    const taskCount = {};
    myTasks.forEach(t => { taskCount[t.type_id] = (taskCount[t.type_id]||0) + (t.quantity||1); });

    const chips = Object.entries(taskCount).map(([tid, qty]) =>
      `<span class="task-chip"><span>${typeMap[tid]||'?'}</span><span class="qty">×${qty}</span></span>`
    ).join('');

    return `
      <div class="member-card">
        <div class="mc-head">
          <div class="mc-avatar">😈</div>
          <div>
            <div class="mc-name">${m.nickname}</div>
            ${m.user_id ? `<div class="mc-id">${m.user_id}</div>` : ''}
          </div>
        </div>
        <div class="mc-tasks">
          ${chips || `<span class="mc-empty">업보 없음</span>`}
        </div>
      </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', e => { curSearch=e.target.value; render(); });
load();
</script>
</body>
</html>

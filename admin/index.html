<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유남라 관리자</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-6SemiBold.woff2')format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2')format('woff2');font-weight:700;font-display:swap;}
:root{
  --bg:#f0fbfb;--surface:#fff;
  --primary:#6dcdd0;--primary-dk:#4ab8bc;--primary-lt:#e8f9f9;
  --text:#1c1c2e;--text-sub:#6b7280;--text-mut:#9de0e2;
  --border:#cef0f1;
  --red-lt:#fef2f2;--red-dk:#ef4444;--green-dk:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'A2z','Noto Sans KR',sans-serif;color:var(--text);min-height:100vh;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--surface);border:1.5px solid var(--border);border-radius:24px;padding:36px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(109,205,208,.12);}
.login-logo{font-family:'A2z',sans-serif;font-size:22px;font-weight:700;color:var(--primary-dk);text-align:center;margin-bottom:6px;}
.login-sub{text-align:center;font-size:12px;color:var(--text-sub);margin-bottom:24px;}
.fi{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;margin-bottom:14px;font-family:inherit;}
.fi:focus{border-color:var(--primary);}
.btn-primary{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-primary:hover{background:var(--primary-dk);}
.login-err{font-size:12px;color:var(--red-dk);text-align:center;margin-top:10px;display:none;}

/* ADMIN */
#adminScreen{display:none;}
.admin-header{background:var(--surface);border-bottom:1.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(109,205,208,.08);}
.admin-logo{font-family:'A2z',sans-serif;font-size:17px;font-weight:700;color:var(--primary-dk);}
.btn-logout{padding:6px 14px;border:1.5px solid var(--border);border-radius:100px;background:none;font-size:12px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:all .2s;}
.btn-logout:hover{border-color:var(--red-dk);color:var(--red-dk);}

/* TABS */
.tab-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:0 20px;display:flex;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{padding:13px 20px;font-size:13px;font-weight:600;color:var(--text-sub);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;white-space:nowrap;position:relative;bottom:-1.5px;flex-shrink:0;}
.tab-btn.active{color:var(--primary-dk);border-bottom-color:var(--primary);}
.tab-btn:hover:not(.active){color:var(--text);}
.tab-content{display:none;max-width:960px;margin:0 auto;padding:24px 20px;}
.tab-content.active{display:block;}

/* SUB NAV */
.sub-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.sub-btn{padding:7px 18px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:all .2s;}
.sub-btn.active{background:var(--primary-lt);border-color:var(--primary);color:var(--primary-dk);}
.sub-page{display:none;}.sub-page.active{display:block;}

/* CARD */
.sc{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(109,205,208,.06);}
.sc-title{font-family:'A2z',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:600px){.r2,.r3{grid-template-columns:1fr;}}
label{font-size:12px;font-weight:600;color:var(--text-sub);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{resize:vertical;min-height:80px;}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;}
.btn-add{background:var(--primary);color:#fff;}.btn-add:hover{background:var(--primary-dk);}
.btn-edit{padding:5px 10px;border:1.5px solid var(--primary);color:var(--primary-dk);background:none;border-radius:7px;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-edit:hover{background:var(--primary-lt);}
.btn-del{padding:5px 10px;border:1.5px solid var(--red-dk);color:var(--red-dk);background:none;border-radius:7px;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-del:hover{background:var(--red-lt);}

/* TABLE */
.tw{overflow-x:auto;border-radius:12px;border:1.5px solid var(--border);}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--primary-lt);}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--primary-dk);border-bottom:1.5px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--primary-lt);}
td{padding:10px 14px;font-size:13px;color:var(--text-sub);}
td.strong{color:var(--text);font-weight:600;}
.empty-row td{text-align:center;padding:28px;color:var(--text-mut);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}

/* COLOR DOTS (일정용) */
.color-sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s;}
.cdot.sel{border-color:var(--text);transform:scale(1.2);}

/* MEMBER GRID */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px;}
.m-card{padding:10px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;}
.m-card:hover{border-color:var(--primary);background:var(--primary-lt);}
.m-card.sel{border-color:var(--primary);background:var(--primary-lt);color:var(--primary-dk);}
.m-card .m-uid{font-size:11px;font-weight:400;color:var(--text-mut);margin-top:2px;}

/* TASK GRID */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;}
.t-card{padding:10px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .2s;}
.t-card:hover{border-color:var(--primary);}
.t-card .t-name{font-size:13px;font-weight:600;flex:1;}
.t-qty{display:flex;align-items:center;gap:4px;}
.t-qty button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .2s;}
.t-qty button:hover{border-color:var(--primary);background:var(--primary-lt);}
.t-qty span{font-size:13px;font-weight:700;min-width:20px;text-align:center;color:var(--primary-dk);}

/* DRAG ITEM */
.type-drag-item,.member-drag-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:grab;transition:all .15s;user-select:none;}
.type-drag-item:hover,.member-drag-item:hover{border-color:var(--primary);}
.drag-handle{color:var(--text-mut);font-size:16px;cursor:grab;flex-shrink:0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--surface);border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:0 12px 48px rgba(109,205,208,.2);transform:scale(.95);transition:transform .2s;}
.modal-overlay.open .modal-box{transform:scale(1);}
.modal-title{font-family:'A2z',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* INQ */
.inq-item{padding:14px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;}
.inq-item.unread{border-color:var(--primary);background:var(--primary-lt);}
.inq-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.inq-nick{font-size:13px;font-weight:700;}
.inq-date{font-size:11px;color:var(--text-mut);}
.inq-body{font-size:13px;color:var(--text-sub);line-height:1.6;}
.inq-actions{display:flex;gap:6px;margin-top:8px;}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🩵 유남라 Admin</div>
    <div class="login-sub">관리자 전용 페이지입니다</div>
    <input class="fi" type="email" id="loginEmail" placeholder="이메일">
    <input class="fi" type="password" id="loginPw" placeholder="비밀번호">
    <button class="btn-primary" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 관리자 화면 -->
<div id="adminScreen">
  <div class="admin-header">
    <div class="admin-logo">🩵 유남라 Admin</div>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('schedule')">📅 일정</button>
    <button class="tab-btn" onclick="switchTab('song')">🎵 노래</button>
    <button class="tab-btn" onclick="switchTab('upbo')">⚡ 업보</button>
    <button class="tab-btn" onclick="switchTab('inquiry')">✉️ 문의</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ 설정</button>
  </div>

  <!-- ══ 일정 ══ -->
  <div class="tab-content active" id="tab-schedule">
    <div class="sc">
      <div class="sc-title">➕ 일정 추가</div>
      <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:140px;"><label>날짜</label><input type="date" id="sDate"></div>
        <div style="flex:1;min-width:140px;"><label>메모/설명</label><input type="text" id="sDesc" placeholder="선택 사항"></div>
      </div>
      <!-- 1부 -->
      <div style="background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <div style="width:14px;height:14px;border-radius:4px;flex-shrink:0;transition:background .2s;" id="dot1"></div>
          <span style="font-size:12px;font-weight:700;color:var(--text-sub);">1부</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div><label>유형</label>
            <select id="sType" onchange="onTypeChange()">
              <option value="broadcast">방송</option>
              <option value="rest">휴방</option>
              <option value="collab">합방</option>
              <option value="contest">대회</option>
              <option value="mc_server">마크서버</option>
              <option value="event">이벤트</option>
              <option value="other">기타</option>
            </select>
          </div>
          <div><label>시간</label><input type="time" id="sTime" value="17:00"></div>
          <div><label>제목</label><input type="text" id="sTitle" placeholder="방송 제목"></div>
        </div>
      </div>
      <!-- 2부 -->
      <div style="background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <div style="width:14px;height:14px;border-radius:4px;flex-shrink:0;transition:background .2s;" id="dot2"></div>
          <span style="font-size:12px;font-weight:700;color:var(--text-sub);">2부 (선택)</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div><label>유형</label>
            <select id="sType2" onchange="onType2Change()">
              <option value="">없음</option>
              <option value="broadcast">방송</option>
              <option value="rest">휴방</option>
              <option value="collab">합방</option>
              <option value="contest">대회</option>
              <option value="mc_server">마크서버</option>
              <option value="event">이벤트</option>
              <option value="other">기타</option>
            </select>
          </div>
          <div><label>시간</label><input type="time" id="sTime2"></div>
          <div><label>제목</label><input type="text" id="sTitle2" placeholder="2부 있을 경우"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;">
        <button class="btn btn-add" onclick="addSchedule()">추가</button>
      </div>
    </div>
    <div class="sc">
      <div class="sc-title">📅 일정 목록</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <input type="month" id="sFilterMonth" style="width:auto;">
        <button class="btn btn-add" onclick="loadSchedules()">조회</button>
      </div>
      <div class="tw">
        <table>
          <thead><tr><th>날짜</th><th>시간</th><th>유형</th><th>제목</th><th>관리</th></tr></thead>
          <tbody id="scheduleBody"><tr class="empty-row"><td colspan="5">조회 버튼을 눌러주세요</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ══ 노래 ══ -->
  <div class="tab-content" id="tab-song">
    <div class="sc">
      <div class="sc-title">➕ 곡 추가</div>
      <div class="r3">
        <div><label>장르</label>
          <select id="songGenre">
            <option value="kpop">K-Pop</option>
            <option value="jpop">J-Pop</option>
            <option value="pop">Pop</option>
            <option value="cn">중국</option>
            <option value="aegyo">애교송</option>
            <option value="etc">기타</option>
          </select>
        </div>
        <div><label>아티스트</label><input type="text" id="songArtist" placeholder="아티스트명"></div>
        <div><label>제목 *</label><input type="text" id="songTitle" placeholder="곡명"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:flex-end;">
        <div><label>난이도 (1~5)</label><input type="number" id="songLevel" min="1" max="5" value="3" style="width:80px;"></div>
        <div style="flex:1;"><label>메모</label><input type="text" id="songMemo" placeholder="선택 메모"></div>
        <button class="btn btn-add" onclick="addSong()">추가</button>
      </div>
    </div>
    <div class="sc">
      <div class="sc-title">🎵 노래 목록</div>
      <div style="margin-bottom:12px;"><input type="text" id="songSearch" placeholder="🔍 검색..." oninput="filterSongs()"></div>
      <div class="tw">
        <table>
          <thead><tr><th>제목</th><th>아티스트</th><th>장르</th><th>난이도</th><th>메모</th><th>관리</th></tr></thead>
          <tbody id="songBody"><tr class="empty-row"><td colspan="4">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ══ 업보 ══ -->
  <div class="tab-content" id="tab-upbo">
    <div class="sub-nav">
      <button class="sub-btn active" onclick="switchUpbo('assign')">📋 업보 부여</button>
      <button class="sub-btn" onclick="switchUpbo('members')">👥 시청자 관리</button>
      <button class="sub-btn" onclick="switchUpbo('types')">🏷️ 타입 관리</button>
    </div>

    <!-- 업보 부여 -->
    <div class="sub-page active" id="upbo-assign">
      <div class="sc">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
          <div class="sc-title" style="margin-bottom:0;">👤 시청자 선택</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="margin:0;font-size:12px;white-space:nowrap;">갱신일</label>
            <input type="date" id="upboDateAssign" style="width:auto;">
            <button class="btn btn-add" style="padding:6px 12px;font-size:12px;" onclick="saveUpboDate()">저장</button>
          </div>
        </div>
        <div style="margin-bottom:10px;"><input type="text" id="assignSearch" placeholder="🔍 시청자 검색..." oninput="filterAssignMembers()"></div>
        <div class="member-grid" id="assignMemberGrid"></div>
      </div>
      <div class="sc" id="assignTaskArea" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
          <div class="sc-title" style="margin-bottom:0;" id="assignTitle">업보 부여</div>
          <div style="display:flex;gap:8px;">
            <button class="btn-del" onclick="clearAllTasks()">전체 초기화</button>
            <button class="btn btn-add" onclick="saveTasks()">💾 저장</button>
          </div>
        </div>
        <div class="task-grid" id="taskGrid"></div>
        <div style="margin-top:14px;">
          <label style="font-size:11px;font-weight:700;color:var(--text-sub);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:6px;">📝 관리자 메모</label>
          <textarea id="memberMemo" placeholder="이 시청자에 대한 메모를 남겨요 (비공개)" style="min-height:80px;font-size:13px;resize:vertical;"></textarea>
          <div style="font-size:11px;color:var(--text-mut);margin-top:4px;">저장 버튼 누를 때 함께 저장돼요</div>
        </div>
      </div>
    </div>

    <!-- 시청자 관리 -->
    <div class="sub-page" id="upbo-members">
      <div class="sc">
        <div class="sc-title">👥 시청자 추가</div>
        <div class="r3">
          <div><label>닉네임 *</label><input type="text" id="memberNick" placeholder="닉네임"></div>
          <div><label>SOOP ID</label><input type="text" id="memberUid" placeholder="user_id"></div>
          <div style="display:flex;align-items:flex-end;"><button class="btn btn-add" onclick="addMember()">추가</button></div>
        </div>
      </div>
      <div class="sc">
        <div class="sc-title">목록</div>
        <div style="margin-bottom:12px;"><input type="text" id="memberSearch" placeholder="🔍 검색..." oninput="filterMembers()"></div>
        <div id="memberList"></div>
      </div>
    </div>

    <!-- 타입 관리 -->
    <div class="sub-page" id="upbo-types">
      <div class="sc">
        <div class="sc-title">🏷️ 업보 타입 추가</div>
        <div class="r3">
          <div><label>타입명 *</label><input type="text" id="typeNm" placeholder="예: 랜덤 단컷"></div>
          <div><label>카테고리</label>
            <select id="typeCat"><option value="normal">일반</option><option value="event">이벤트</option></select>
          </div>
          <div style="display:flex;align-items:flex-end;"><button class="btn btn-add" onclick="addTaskType()">추가</button></div>
        </div>
      </div>
      <div class="sc">

async function doLogin(){

  const pw=document.getElementById('loginPw').value;
  const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{

    body:JSON.stringify({email,password:pw})

  const data=await res.json();
  if(data.access_token){

async function loadSettings(){
  const {data}=await supabaseClient.from('upbo_settings').select('*');
  const map=Object.fromEntries((data||[]).map(d=>[d.key,d.value]));

  // 목표
  let goals=[];
  try{goals=JSON.parse(map.goals||'[]');}catch(e){}
  renderGoals(goals);

  // 후원 API
  let apis=[];
  try{apis=JSON.parse(map.donation_api||'[]');}catch(e){}
  renderApis(apis);
}

function renderGoals(goals){
  document.getElementById('goalsList').innerHTML=goals.map((g,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;">
      <span style="font-size:13px;flex:1;${g.done?'text-decoration:line-through;opacity:.5':''}"><strong style="color:var(--primary-dk);margin-right:6px;">${String(g.num||i+1).padStart(2,'0')}</strong>${g.text}</span>
      <button class="btn-edit" onclick="toggleGoal(${i})">${g.done?'복원':'완료'}</button>
      <button class="btn-del" onclick="delGoal(${i})">삭제</button>
    </div>`).join('');
  window._goals=goals;
}

function renderApis(apis){
  document.getElementById('apiList').innerHTML=apis.map((a,i)=>`
    <div style="display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;align-items:center;">
      <input type="text" value="${a.cnt}" onchange="updateApi(${i},'cnt',this.value)" style="font-size:13px;padding:7px 10px;">
      <input type="text" value="${a.label}" onchange="updateApi(${i},'label',this.value)" style="font-size:13px;padding:7px 10px;">
      <button class="btn-del" onclick="delApi(${i})">삭제</button>
    </div>`).join('');
  window._apis=apis;
}

function updateApi(i,key,val){window._apis[i][key]=val;}

async function saveGoals(){
  await supabaseClient.from('upbo_settings').upsert([{key:'goals',value:JSON.stringify(window._goals||[])}]);
  toast('✅ 목표 저장됨');
}
async function saveApis(){
  await supabaseClient.from('upbo_settings').upsert([{key:'donation_api',value:JSON.stringify(window._apis||[])}]);
  toast('✅ 후원 API 저장됨');loadSettings();
}
async function addGoal(){
  const text=document.getElementById('newGoalText').value.trim();
  if(!text)return;
  const goals=window._goals||[];
  const nums=goals.map(g=>parseInt(g.num)||0);
  const nextNum=nums.length?Math.max(...nums)+1:1;
  goals.push({num:nextNum,text,done:document.getElementById('newGoalDone').value==='true'});
  await supabaseClient.from('upbo_settings').upsert([{key:'goals',value:JSON.stringify(goals)}]);
  document.getElementById('newGoalText').value='';
  toast('✅ 목표 추가됨');loadSettings();
}
function toggleGoal(i){const g=window._goals||[];g[i].done=!g[i].done;renderGoals(g);}
async function delGoal(i){
  const g=(window._goals||[]).filter((_,idx)=>idx!==i);
  await supabaseClient.from('upbo_settings').upsert([{key:'goals',value:JSON.stringify(g)}]);
  toast('🗑️ 삭제됨');loadSettings();
}
async function addApi(){
  const cnt=document.getElementById('newApiCnt').value.trim();
  const label=document.getElementById('newApiLabel').value.trim();
  if(!cnt||!label)return;
  const apis=window._apis||[];
  apis.push({cnt,label});
  await supabaseClient.from('upbo_settings').upsert([{key:'donation_api',value:JSON.stringify(apis)}]);
  document.getElementById('newApiCnt').value='';
  document.getElementById('newApiLabel').value='';
  toast('✅ 추가됨');loadSettings();
}
async function delApi(i){
  const apis=(window._apis||[]).filter((_,idx)=>idx!==i);
  await supabaseClient.from('upbo_settings').upsert([{key:'donation_api',value:JSON.stringify(apis)}]);
  toast('🗑️ 삭제됨');loadSettings();
}

async function loadSchedules(){
  const m=document.getElementById('sFilterMonth').value;if(!m)return;

  const s=`${y}-${mo}-01`,e=`${y}-${mo}-${String(last).padStart(2,'0')}`;
  const{data}=await supabaseClient.from('schedules').select('*').gte('date',s).lte('date',e).order('date').order('slot1_time');

}

  const tb=document.getElementById('scheduleBody');

  tb.innerHTML=scheduleData.map(s=>{

    const statusMap={normal:'방송',holiday:'휴방',special:'특방',anniversary:'기념일'};
    const c=TC[s.status]||TC.broadcast;
    const l=statusMap[s.status]||s.status;
    return `<tr>
      <td class="strong">${s.date} (${DOW[dt.getDay()]})</td>
      <td>${s.slot1_time||'-'}</td>
      <td><span class="badge" style="background:${c}22;color:${c}">${l}</span></td>

let taskTypes=[];
async function loadTaskTypes(){
  const{data}=await supabaseClient.from('upbo_task_types').select('*').order('sort_order').order('id');
  taskTypes=data||[];renderTypeList();
}
function renderTypeList(){
  const el=document.getElementById('typeList');
  if(!taskTypes.length){el.innerHTML='<div style="color:var(--text-mut);font-size:13px;padding:12px;">업보 타입이 없어요</div>';return;}
  el.innerHTML=`<div id="typeListInner" style="display:flex;flex-direction:column;gap:6px;">
    ${taskTypes.map(t=>`
    <div class="type-drag-item" draggable="true" data-id="${t.id}">
      <span class="drag-handle">⠿</span>
      <span class="badge" style="background:${t.category==='event'?'#fde8f0':'var(--primary-lt)'};color:${t.category==='event'?'#be185d':'var(--primary-dk)'};">${t.category==='event'?'이벤트':'일반'}</span>
      <span style="font-size:13px;font-weight:600;flex:1;">${t.name}</span>
      <button class="btn-edit" onclick="editTaskType('${t.id}')">수정</button>
      <button class="btn-del" onclick="delTaskType('${t.id}')">삭제</button>
    </div>`).join('')}
  </div>`;
  initTypeDragDrop();
}
function initTypeDragDrop(){
  const container=document.getElementById('typeListInner');if(!container)return;
  let dragEl=null;
  container.querySelectorAll('.type-drag-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragEl=item;item.style.opacity='.4';e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragend',()=>{dragEl=null;item.style.opacity='1';saveTypeOrder();});
    item.addEventListener('dragover',e=>{
      e.preventDefault();if(!dragEl||dragEl===item)return;
      const mid=item.getBoundingClientRect().top+item.getBoundingClientRect().height/2;
      if(e.clientY<mid)container.insertBefore(dragEl,item);else container.insertBefore(dragEl,item.nextSibling);
    });
    item.addEventListener('dragenter',e=>{e.preventDefault();if(item!==dragEl)item.style.background='var(--primary-lt)';});
    item.addEventListener('dragleave',()=>{item.style.background='var(--bg)';});
    item.addEventListener('drop',()=>{item.style.background='var(--bg)';});
  });
}
async function saveTypeOrder(){
  const items=[...document.querySelectorAll('#typeListInner .type-drag-item')];
  await Promise.all(items.map((el,i)=>supabaseClient.from('upbo_task_types').update({sort_order:i}).eq('id',el.dataset.id)));
  taskTypes=items.map(el=>taskTypes.find(t=>t.id===el.dataset.id)).filter(Boolean);
  toast('✅ 순서 저장됨');
}
async function addTaskType(){
  const name=document.getElementById('typeNm').value.trim();
  if(!name){toast('타입명을 입력해주세요');return;}
  const maxOrder=Math.max(0,...taskTypes.map(t=>t.sort_order||0));
  const{error}=await supabaseClient.from('upbo_task_types').insert([{name,category:document.getElementById('typeCat').value,sort_order:maxOrder+1}]);
  if(error){toast('추가 실패');return;}
  toast('✅ 타입 추가!');document.getElementById('typeNm').value='';loadTaskTypes();
}
async function delTaskType(id){
  if(!confirm('삭제할까요?'))return;
  await supabaseClient.from('upbo_task_types').delete().eq('id',id);
  toast('🗑️ 삭제됨');loadTaskTypes();
}
function editTaskType(id){
  const t=taskTypes.find(x=>x.id===id);if(!t)return;
  document.getElementById('editModalTitle').textContent='업보 수정';
  document.getElementById('editModalBody').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div><label>타입명</label><input type="text" id="eTypeName" value="${t.name}"></div>
      <div><label>카테고리</label><select id="eTypeCat">
        <option value="normal"${t.category==='normal'?' selected':''}>일반</option>
        <option value="event"${t.category==='event'?' selected':''}>이벤트</option>
      </select></div>
      <div style="text-align:right;"><button class="btn btn-add" onclick="saveTaskTypeEdit('${id}')">저장</button></div>
    </div>`;
  document.getElementById('editModal').classList.add('open');
}
async function saveTaskTypeEdit(id){
  const{error}=await supabaseClient.from('upbo_task_types').update({
    name:document.getElementById('eTypeName').value.trim(),
    category:document.getElementById('eTypeCat').value
  }).eq('id',id);
  if(error){toast('수정 실패');return;}
  toast('✅ 수정됨');closeEditModal();loadTaskTypes();
}

// ══════════════════════════
// 업보 — 시청자
// ══════════════════════════
let allMembers=[],selMemberId=null,taskPending={};

async function loadMembers(){
  const{data}=await supabaseClient.from('upbo_members').select('*').order('sort_order').order('created_at');
  allMembers=data||[];
  renderMemberList(allMembers);
  renderAssignMemberGrid(allMembers);
}
function filterMembers(){
  const q=document.getElementById('memberSearch').value.toLowerCase();
  renderMemberList(allMembers.filter(m=>(m.nickname||'').toLowerCase().includes(q)));
}
function filterAssignMembers(){
  const q=document.getElementById('assignSearch').value.toLowerCase();
  renderAssignMemberGrid(allMembers.filter(m=>(m.nickname||'').toLowerCase().includes(q)));
}
function renderMemberList(list){
  const el=document.getElementById('memberList');
  if(!list.length){el.innerHTML='<div style="color:var(--text-mut);font-size:13px;padding:12px;">시청자가 없어요</div>';return;}
  el.innerHTML=`<div id="memberListInner" style="display:flex;flex-direction:column;gap:6px;">
    ${list.map(m=>`
    <div class="member-drag-item" draggable="true" data-id="${m.id}">
      <span class="drag-handle">⠿</span>
      <span style="font-size:13px;font-weight:600;flex:1;">${m.nickname}${m.user_id?` <span style="font-size:11px;color:var(--text-mut);">(${m.user_id})</span>`:''}</span>
      <button class="btn-edit" onclick="editMember('${m.id}')">수정</button>
      <button class="btn-del" onclick="delMember('${m.id}')">삭제</button>
    </div>`).join('')}
  </div>`;
  initMemberDragDrop();
}
function renderAssignMemberGrid(list){
  const el=document.getElementById('assignMemberGrid');
  el.innerHTML=list.map(m=>`
    <div class="m-card${selMemberId===m.id?' sel':''}" onclick="selectMember('${m.id}')">
      ${m.nickname}
      ${m.user_id?`<div class="m-uid">${m.user_id}</div>`:''}
    </div>`).join('');
}
async function selectMember(id){
  selMemberId=id;taskPending={};
  const m=allMembers.find(x=>x.id===id);if(!m)return;
  document.getElementById('assignTitle').textContent=`${m.nickname} 업보 부여`;
  document.getElementById('memberMemo').value=m.memo||'';
  document.getElementById('assignTaskArea').style.display='block';
  renderAssignMemberGrid(allMembers.filter(x=>{
    const q=document.getElementById('assignSearch').value.toLowerCase();
    return !q||(x.nickname||'').toLowerCase().includes(q);
  }));

  // 기존 업보 데이터 로드
  const {data:existing}=await supabaseClient.from('upbo_tasks').select('*').eq('member_id',id);
  (existing||[]).forEach(t=>{
    taskPending[t.type_id]=(taskPending[t.type_id]||0)+(t.quantity||1);
  });

  renderTaskGrid();
}
function renderTaskGrid(){
  const el=document.getElementById('taskGrid');
  if(!taskTypes.length){el.innerHTML='<div style="color:var(--text-mut);font-size:13px;">타입을 먼저 추가해주세요</div>';return;}
  el.innerHTML=taskTypes.map(t=>`
    <div class="t-card">
      <span class="t-name">${t.name}</span>
      <div class="t-qty">
        <button onclick="adjustTask('${t.id}',-1)">−</button>
        <span id="qty-${t.id}">${taskPending[t.id]||0}</span>
        <button onclick="adjustTask('${t.id}',1)">+</button>
      </div>
    </div>`).join('');
}
function adjustTask(typeId,delta){
  taskPending[typeId]=(taskPending[typeId]||0)+delta;
  if(taskPending[typeId]<0)taskPending[typeId]=0;
  const el=document.getElementById(`qty-${typeId}`);
  if(el)el.textContent=taskPending[typeId];
}
function clearAllTasks(){
  taskPending={};renderTaskGrid();
}
async function saveTasks(){
  if(!selMemberId){toast('시청자를 선택해주세요');return;}

  // 기존 업보 전부 삭제 후 현재 값으로 재삽입
  await supabaseClient.from('upbo_tasks').delete().eq('member_id',selMemberId);

  const inserts=Object.entries(taskPending).filter(([,q])=>q>0).map(([tid,qty])=>({member_id:selMemberId,type_id:tid,quantity:qty}));
  if(inserts.length){
    const{error}=await supabaseClient.from('upbo_tasks').insert(inserts);
    if(error){toast('저장 실패: '+error.message);return;}
  }
  const memo=document.getElementById('memberMemo').value.trim();
  await supabaseClient.from('upbo_members').update({memo}).eq('id',selMemberId);
  toast('✅ 저장 완료!');taskPending={};renderTaskGrid();
}
async function saveUpboDate(){
  const val=document.getElementById('upboDateAssign').value;
  await supabaseClient.from('upbo_settings').upsert([{key:'updated_at',value:val}]);
  toast('✅ 갱신일 저장됨');
}
function initMemberDragDrop(){
  const container=document.getElementById('memberListInner');if(!container)return;
  let dragEl=null;
  container.querySelectorAll('.member-drag-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragEl=item;item.style.opacity='.4';e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragend',()=>{dragEl=null;item.style.opacity='1';saveMemberOrder();});
    item.addEventListener('dragover',e=>{
      e.preventDefault();if(!dragEl||dragEl===item)return;
      const mid=item.getBoundingClientRect().top+item.getBoundingClientRect().height/2;
      if(e.clientY<mid)container.insertBefore(dragEl,item);else container.insertBefore(dragEl,item.nextSibling);
    });
    item.addEventListener('dragenter',e=>{e.preventDefault();if(item!==dragEl)item.style.background='var(--primary-lt)';});
    item.addEventListener('dragleave',()=>{item.style.background='var(--bg)';});
    item.addEventListener('drop',()=>{item.style.background='var(--bg)';});
  });
}
async function saveMemberOrder(){
  const items=[...document.querySelectorAll('#memberListInner .member-drag-item')];
  await Promise.all(items.map((el,i)=>supabaseClient.from('upbo_members').update({sort_order:i}).eq('id',el.dataset.id)));
  toast('✅ 순서 저장됨');
}
async function addMember(){
  const nick=document.getElementById('memberNick').value.trim();
  if(!nick){toast('닉네임을 입력해주세요');return;}
  const maxOrder=Math.max(0,...allMembers.map(m=>m.sort_order||0));
  const{error}=await supabaseClient.from('upbo_members').insert([{nickname:nick,user_id:document.getElementById('memberUid').value.trim()||null,sort_order:maxOrder+1}]);
  if(error){toast('추가 실패');return;}
  toast('✅ 추가!');['memberNick','memberUid'].forEach(id=>document.getElementById(id).value='');
  loadMembers();
}
async function delMember(id){
  if(!confirm('삭제할까요? 관련 업보도 모두 삭제됩니다.'))return;
  await supabaseClient.from('upbo_members').delete().eq('id',id);
  toast('🗑️ 삭제됨');loadMembers();
}
function editMember(id){
  const m=allMembers.find(x=>x.id===id);if(!m)return;
  document.getElementById('editModalTitle').textContent='시청자 수정';
  document.getElementById('editModalBody').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div><label>닉네임</label><input type="text" id="eMemberNick" value="${m.nickname}"></div>
      <div><label>SOOP ID</label><input type="text" id="eMemberUid" value="${m.user_id||''}"></div>
      <div><label>메모 (비공개)</label><textarea id="eMemberMemo">${m.memo||''}</textarea></div>
      <div style="text-align:right;"><button class="btn btn-add" onclick="saveMemberEdit('${id}')">저장</button></div>
    </div>`;
  document.getElementById('editModal').classList.add('open');
}
async function saveMemberEdit(id){
  const{error}=await supabaseClient.from('upbo_members').update({
    nickname:document.getElementById('eMemberNick').value.trim(),
    user_id:document.getElementById('eMemberUid').value.trim()||null,
    memo:document.getElementById('eMemberMemo').value.trim()||null
  }).eq('id',id);
  if(error){toast('수정 실패');return;}
  toast('✅ 수정됨');closeEditModal();loadMembers();
}

// ══════════════════════════
// 문의
// ══════════════════════════
async function loadInquiries(){
  const{data}=await supabaseClient.from('upbo_inquiries').select('*').order('created_at',{ascending:false});
  const el=document.getElementById('inqList');
  if(!data||!data.length){el.innerHTML='<div style="text-align:center;padding:24px;color:var(--text-mut);">문의가 없어요</div>';return;}
  el.innerHTML=data.map(q=>`
    <div class="inq-item${!q.is_read?' unread':''}">
      <div class="inq-head">
        <span class="inq-nick">${q.nickname||'익명'}${!q.is_read?' <span style="font-size:11px;color:var(--primary-dk);background:var(--primary-lt);padding:2px 7px;border-radius:20px;">NEW</span>':''}</span>
        <span class="inq-date">${q.created_at?.slice(0,10)||''}</span>
      </div>
      <div class="inq-body">${q.content||''}</div>
      <div class="inq-actions">
        ${!q.is_read?`<button class="btn-edit" onclick="markRead('${q.id}')">읽음</button>`:''}
        <button class="btn-del" onclick="delInquiry('${q.id}')">삭제</button>
      </div>
    </div>`).join('');
}
async function markRead(id){
  await supabaseClient.from('upbo_inquiries').update({is_read:true}).eq('id',id);loadInquiries();
}
async function markAllRead(){
  await supabaseClient.from('upbo_inquiries').update({is_read:true}).eq('is_read',false);
  toast('✅ 전체 읽음');loadInquiries();
}
async function delInquiry(id){
  if(!confirm('삭제할까요?'))return;
  await supabaseClient.from('upbo_inquiries').delete().eq('id',id);
  toast('🗑️ 삭제됨');loadInquiries();
}
</script>

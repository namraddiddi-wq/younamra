<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유남라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-6SemiBold.woff2')format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2')format('woff2');font-weight:700;font-display:swap;}
</style>
<style>
:root {
  --primary:#6dcdd0;--primary-light:#9de0e2;--primary-pale:#e8f9f9;
  --primary-dark:#4ab8bc;--primary-deep:#2a8a8d;
  --accent:#f0a8c8;--accent-soft:#fde8f2;
  --white:#fff;--gray-100:#f7f7f7;--gray-200:#eee;--gray-400:#bbb;--gray-600:#888;
  --text:#1c1c2e;--text-muted:#6b7280;--shadow:rgba(109,205,208,.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'A2z','Noto Sans KR',sans-serif;background:#f0fbfb;color:var(--text);}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1.5px solid var(--primary-pale);display:flex;justify-content:center;}
nav a{font-family:'A2z',sans-serif;font-size:.95rem;color:var(--text-muted);text-decoration:none;padding:16px 36px;border-bottom:2.5px solid transparent;transition:color .2s,border-color .2s;}
nav a:hover,nav a.active{color:var(--primary-deep);border-bottom-color:var(--primary);}
main{max-width:960px;margin:0 auto;padding:40px 20px 80px;}

/* HEADER */
.page-head{font-family:'A2z',sans-serif;font-size:1.5rem;color:var(--primary-deep);margin-bottom:24px;display:flex;align-items:center;gap:10px;}

/* SEARCH + FILTER */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1.5px solid var(--gray-200);border-radius:12px;font-family:'A2z','Noto Sans KR',sans-serif;font-size:.9rem;background:var(--white);outline:none;transition:border-color .2s;}
.search-box input:focus{border-color:var(--primary);}
.search-box::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;}
.filter-btn{padding:9px 16px;border-radius:10px;border:1.5px solid var(--gray-200);background:var(--white);font-family:'A2z','Noto Sans KR',sans-serif;font-size:.85rem;cursor:pointer;color:var(--text-muted);transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:var(--primary-pale);border-color:var(--primary);color:var(--primary-deep);}

/* STATS */
.stats{font-size:.85rem;color:var(--text-muted);margin-bottom:16px;}
.stats strong{color:var(--primary-deep);}

/* TABLE */
.song-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 3px 20px var(--shadow);}
.song-table thead tr{background:var(--primary-pale);}
.song-table th{padding:12px 16px;text-align:left;font-family:'A2z',sans-serif;font-size:.85rem;color:var(--primary-deep);font-weight:600;border-bottom:1.5px solid var(--primary-light);}
.song-table tbody tr{border-bottom:1px solid var(--gray-100);transition:background .15s;}
.song-table tbody tr:last-child{border-bottom:none;}
.song-table tbody tr:hover{background:var(--primary-pale);}
.song-table td{padding:11px 16px;font-size:.88rem;color:var(--text-muted);}
.song-table td.title{color:var(--text);font-weight:500;}
.genre-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.76rem;font-weight:600;}
.g-kpop{background:#e8f0ff;color:#3a5cc4;}
.g-jpop{background:#fff0e8;color:#c46030;}
.g-pop {background:#f0ffe8;color:#4a8a30;}
.g-cn  {background:#ffe8f8;color:#c040a0;}
.g-etc {background:var(--gray-100);color:var(--gray-600);}
.g-aegyo{background:#ffe8f5;color:#c040a0;}

.level-dots{display:flex;gap:3px;align-items:center;}
.dot-f{width:8px;height:8px;border-radius:50%;background:var(--primary);}
.dot-e{width:8px;height:8px;border-radius:50%;background:var(--gray-200);}

.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}

footer{text-align:center;padding:28px 20px;color:var(--gray-400);font-size:.8rem;border-top:1px solid var(--gray-200);}

@media(max-width:768px){
  nav a{padding:14px 18px;font-size:.85rem;}
  .song-table th:nth-child(4),.song-table td:nth-child(4){display:none;}
  .song-table th:nth-child(5),.song-table td:nth-child(5){display:none;}
}
</style>
</head>
<body>
<nav>
  <a href="../">프로필</a>
  <a href="../schedule/">일정</a>
  <a href="#" class="active">노래책</a>
  <a href="../upbo/">업보</a>
</nav>
<main>
  <div class="page-head">🎵 노래책</div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡명 · 아티스트 검색...">
    </div>
    <button class="filter-btn active" data-genre="all">전체</button>
    <button class="filter-btn" data-genre="kpop">K-Pop</button>
    <button class="filter-btn" data-genre="jpop">J-Pop</button>
    <button class="filter-btn" data-genre="pop">Pop</button>
    <button class="filter-btn" data-genre="cn">중국</button>
    <button class="filter-btn" data-genre="aegyo">애교송</button>
    <button class="filter-btn" data-genre="etc">기타</button>
  </div>

  <div class="stats" id="stats">불러오는 중...</div>

  <table class="song-table">
    <thead>
      <tr>
        <th>#</th>
        <th>제목</th>
        <th>아티스트</th>
        <th>장르</th>
        <th>난이도</th>
      </tr>
    </thead>
    <tbody id="songBody">
      <tr><td colspan="5"><div class="empty-state"><div class="icon">🎵</div>불러오는 중...</div></td></tr>
    </tbody>
  </table>
</main>
<footer>유남라 팬사이트 · 팬 이름 유랑이 · 팬닉 뒤에 ^´</footer>

<script>
const SUPABASE_URL  = 'https://xigbjaayjqshjulsovqn.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpZ2JqYWF5anFzaGp1bHNvdnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjQwNzgsImV4cCI6MjA5NTQwMDA3OH0.B7akZMoAdrjF7CiLMNHvTOmO1dapHTlkEL8fbho30Us';

const GENRE_LABEL = {kpop:'K-Pop',jpop:'J-Pop',pop:'Pop',cn:'중국',aegyo:'애교송',etc:'기타'};
const GENRE_CLASS = {kpop:'g-kpop',jpop:'g-jpop',pop:'g-pop',cn:'g-cn',aegyo:'g-aegyo',etc:'g-etc'};

let allSongs = [];
let curGenre = 'all';
let curSearch = '';

async function loadSongs() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?order=sort_order.asc,created_at.asc`, {
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
  });
  allSongs = await res.json();
  render();
}

function render() {
  let list = allSongs;
  if (curGenre !== 'all') list = list.filter(s => s.genre === curGenre);
  if (curSearch) {
    const q = curSearch.toLowerCase();
    list = list.filter(s => (s.title||'').toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q));
  }
  const tbody = document.getElementById('songBody');
  document.getElementById('stats').innerHTML = `총 <strong>${allSongs.length}</strong>곡 · 표시 <strong>${list.length}</strong>곡`;
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="icon">🔍</div>검색 결과가 없어요</div></td></tr>`;
    return;
  }
  tbody.innerHTML = list.map((s,i) => `
    <tr>
      <td style="color:var(--gray-400);font-size:.8rem;">${i+1}</td>
      <td class="title">${s.title||'-'}</td>
      <td>${s.artist||'-'}</td>
      <td><span class="genre-badge ${GENRE_CLASS[s.genre]||'g-etc'}">${GENRE_LABEL[s.genre]||'기타'}</span></td>
      <td><div class="level-dots">${[1,2,3,4,5].map(n=>`<span class="${n<=(s.level||3)?'dot-f':'dot-e'}"></span>`).join('')}</div></td>
    </tr>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', e => { curSearch = e.target.value; render(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curGenre = btn.dataset.genre;
    render();
  });
});

loadSongs();
</script>
</body>
</html>
